<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada - {{TITLE}}</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ticket-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            position: relative;
        }

        .ticket-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .ticket-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.1)"/><circle cx="10" cy="60" r="0.5" fill="rgba(255,255,255,0.1)"/><circle cx="90" cy="40" r="0.5" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
        }

        .ticket-title {
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 10px 0;
            position: relative;
            z-index: 1;
        }

        .ticket-subtitle {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .ticket-body {
            padding: 30px 20px;
        }

        .ticket-info {
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: bold;
            color: #666;
            font-size: 14px;
        }

        .info-value {
            color: #333;
            font-size: 14px;
            text-align: right;
        }

        .qr-section {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .qr-code {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background: white;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-text {
            font-size: 12px;
            color: #666;
            margin: 0;
        }

        .ticket-footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .footer-text {
            font-size: 12px;
            color: #666;
            margin: 0;
        }

        .ticket-id {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 60px;
            color: rgba(102, 126, 234, 0.1);
            font-weight: bold;
            pointer-events: none;
            z-index: 0;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .ticket-container {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="ticket-container">
        <div class="watermark">TICKET</div>
        
        <div class="ticket-header">
            <h1 class="ticket-title">{{TITLE}}</h1>
            <p class="ticket-subtitle">Entrada de Teatro</p>
        </div>
        
        <div class="ticket-body">
            <div class="ticket-info">
                <div class="info-row">
                    <span class="info-label">Nombre:</span>
                    <span class="info-value">{{NAME}}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Fecha:</span>
                    <span class="info-value">{{DATE}}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Hora:</span>
                    <span class="info-value">{{TIME}}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Asiento:</span>
                    <span class="info-value">{{SEAT}}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Precio:</span>
                    <span class="info-value">{{PRICE}}</span>
                </div>
            </div>
            
            <div class="qr-section">
                <div class="qr-code">
                    <img src="{{QR_CODE}}" alt="QR Code" />
                </div>
                <p class="qr-text">Escanea este código QR para verificar tu entrada</p>
            </div>
        </div>
        
        <div class="ticket-footer">
            <p class="footer-text">TeclaWEB - Sistema de Gestión de Teatro</p>
            <p class="ticket-id">ID: {{TICKET_ID}}</p>
        </div>
    </div>
</body>
</html>
